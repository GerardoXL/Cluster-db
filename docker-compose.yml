version: '3.8'
services:
    # -------------------------
    # NODO 1: primario
    # -------------------------
    node1:
        image: postgres:17
        container_name: db-node1
        restart: unless-stopped
        environment: 
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            REPLICA_USER: ${REPLICA_USER}
            REPLICA_PASSWORD: ${REPLICA_PASSWORD}
            APP_USER: ${APP_USER}
            APP_PASSWORD: ${APP_PASSWORD}
            MONITOR_USER: ${MONITOR_USER}
            MONITOR_PASSWORD: ${MONITOR_PASSWORD}
            TZ: "UTC"

        volumes:
            - node1_data:/var/lib/postgresql/data
            #se inyecta el script bash dinamico:
            - ./scripts/init.sh:/docker-entrypoint-initdb.d/init.sh 
            # --------------
            - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
            - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf
        # Obligas al nodo a arrancar con tu configuración
        command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
        networks:
            - cluster-net

    # -------------------------
    # NODO 2 y 3: SECUNDARIOS
    # -------------------------
    node2:
        image: postgres:17
        container_name: db-node2
        restart: unless-stopped
        environment: 
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            PGPASSWORD: ${REPLICA_PASSWORD}
            REPLICA_USER: ${REPLICA_USER}
        volumes:
            - node2_data:/var/lib/postgresql/data
            - ./scripts/setup-replica.sh:/scripts/setup-replica.sh
        entrypoint: ["bash", "/scripts/setup-replica.sh"]
        networks:
            - cluster-net

    node3:
        image: postgres:17
        container_name: db-node3
        restart: unless-stopped
        environment: 
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            PGPASSWORD: ${REPLICA_PASSWORD}
            REPLICA_USER: ${REPLICA_USER}
        volumes:
            - node3_data:/var/lib/postgresql/data
            - ./scripts/setup-replica.sh:/scripts/setup-replica.sh
        entrypoint: ["bash", "/scripts/setup-replica.sh"]
        networks:
            - cluster-net

    # -------------------------
    # PROXY
    # -------------------------
    haproxy:
        image: haproxy:3.4.4
        container_name: haproxy-lib
        ports: 
        - "5000:5000"
        - "5001:5001"
        - "8404:8404"
        volumes:
            - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
        networks:
            - cluster-net
        depends_on:
            - node1

    # ---- monitoreo -----
    postgres-exporter:
        image: prometheuscommunity/postgres-exporter:latest
        container_name: postgres_exporter
        restart: unless-stopped
        environment:
            DATA_SOURCE_NAME: "postgresql://${MONITOR_USER}:${MONITOR_PASSWORD}@db-node1:5432/${POSTGRES_DB}?sslmode=disable"
        ports:
            - "19187:9187"
        depends_on:
            - node1
        networks:
            - cluster-net
    # ----prometheus---
    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus_tsdb
        restart: unless-stopped
        volumes:
            - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        command: 
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
        ports:
            - "9090:9090"
        depends_on:
            - postgres-exporter
        networks:
            - cluster-net
    # ---- grafana ----
    grafana:
        image: grafana/grafana:latest
        container_name: grafana_dashboard
        restart: unless-stopped
        ports:
            - "3000:3000"
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
        volumes:
            - grafana_data:/var/lib/grafana
        depends_on:
            - prometheus
        networks:
            - cluster-net
volumes:
    node1_data:
    node2_data:
    node3_data:
    # --- volumenes nuevos para prometeus y grafana---
    prometheus_data:
    grafana_data:

networks:
    cluster-net:
        driver: bridge